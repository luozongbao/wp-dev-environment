; PHP configuration for WordPress (yadepan)
; Mounted to /usr/local/etc/php/conf.d/uploads.ini inside the wordpress container
; Overrides should focus on upload size, execution time, and memory to support
; large media uploads, theme/plugin installs, and ACF/Block editor workflows.

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;; File Uploads ;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Maximum allowed size for uploaded files.
file_uploads       = On
upload_max_filesize = 256M

; Maximum size of POST data that PHP will accept.
post_max_size       = 256M

; Maximum number of files allowed per upload (used by the media uploader).
max_file_uploads    = 50

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;; Execution Limits ;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Maximum execution time of each script, in seconds (0 = no limit).
max_execution_time  = 300

; Maximum amount of time each script may spend parsing request data, in seconds.
max_input_time      = 300

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;; Memory Limits ;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Maximum amount of memory a script may consume.
memory_limit        = 512M

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;;;;;;;;;; WordPress Friendly ;;;;;;;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Slightly larger input variable limits — useful for large forms / ACF fields.
max_input_vars      = 3000

; Disable PHP execution time limit for admin-side heavy operations (imports, etc.).
; Comment out if you want to enforce strict time limits everywhere.
; max_execution_time = 0
