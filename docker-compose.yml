services:
  wordpress:
    image: docker.m.daocloud.io/library/wordpress:6-php8.3-apache
    container_name: ${PROJECT_NAME}-wordpress-app
    restart: unless-stopped
    ports:
      - ${PORT:-8081}:80
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: ${DATABASEUSER:-wordpress_user}
      WORDPRESS_DB_PASSWORD: ${DATABASEPASS:-wordpress_password}
      WORDPRESS_DB_NAME: ${DATABASENAME:-wordpress_db}
      # ค่า upload limit ผ่าน WP config (สำหรับ media upload)
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://${DOMAIN}:${PORT}');
        define('WP_SITEURL', 'http://${DOMAIN}:${PORT}');
        define('WP_MEMORY_LIMIT', '256M');
        define('WP_MAX_MEMORY_LIMIT', '512M');
        @ini_set('upload_max_filesize', '256M');
        @ini_set('post_max_size', '256M');
        @ini_set('max_execution_time', '300');
        @ini_set('max_input_time', '300');
    volumes:
      - wordpress_files:/var/www/html
      - ./mytheme/:/var/www/html/wp-content/themes/MyTheme:rw
      - ./myplugin/:/var/www/html/wp-content/plugins/MyPlugin:rw
      # เพิ่ม PHP ini override สำหรับ Apache + upload limit
      - ./php.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  db:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: ${PROJECT_NAME}-wordpress-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DATABASENAME:-wordpress_db}
      MYSQL_USER: ${DATABASEUSER:-wordpress_user}
      MYSQL_PASSWORD: ${DATABASEPASS:-wordpress_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  phpmyadmin:
    image: docker.m.daocloud.io/library/phpmyadmin:latest
    container_name: ${PROJECT_NAME}-wordpress-phpmyadmin
    restart: unless-stopped
    ports:
      - ${PHPMYADMIN_PORT:-8082}:80
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    depends_on:
      - db
    networks:
      - app_network

networks:
  app_network:
    name: ${PROJECT_NAME}_network
    driver: bridge

volumes:
  wordpress_files:
    name: ${PROJECT_NAME}_wordpress_files
  db_data:
    name: ${PROJECT_NAME}_db_data